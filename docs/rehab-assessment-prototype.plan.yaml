# -----------------------------------------------------------------------------
# 6. STAGED BUILD PLAN
# -----------------------------------------------------------------------------
stages:

  - id: S0
    name: Approval of this document
    owner: Client
    output: Answers to open_questions Q1-Q6, images for sections 1 and 6-9.
    blocking: true
    note: Stage 1 can start without it; stages 3-5 cannot be finalised without Q1.

  - id: S1
    name: Design system, shell & component library
    est: 1 day
    deliverables:
      - index.html            # journey landing page with the 5 mocked steps
      - assets/css/theme.css  # teal/slate palette matching the supplied form
      - assets/css/print.css
      - assets/js/components.js
      - assets/js/assessment.config.js
    contains:
      - Patient header, precaution banner, section rail, autosave indicator.
      - All components from section 4, demonstrated on a component gallery page.
    acceptance:
      - Every component works standalone with no console errors.
      - Print preview of the shell is clean.

  - id: S2
    name: Journey mock — Registration, Vitals, OPD, Referral
    est: 0.5 day
    deliverables: [ journey/registration.html, journey/vitals.html, journey/opd.html, journey/referral.html ]
    contains:
      - Read-only cards populated from a seeded demo patient (synthetic data only).
      - OPD screen shows which of its fields flow into the rehab form (highlighted).
      - Button labelled 'Refer to Rehabilitation' lands on the assessment.
    acceptance: Client can click end-to-end from registration to assessment.

  - id: S3
    name: Assessment sections 1-5
    est: 1.5 days
    covers: [1, 2, 3, 4, 5]
    contains:
      - Inherited-field treatment for Primary Dx and Relevant Medical Hx (C11).
      - Allergy chips writing to the patient-level registry (C05).
      - Precautions driving the sticky banner + mandatory detail (C06).
      - Milestone fields with delay flags and "Not achieved" (C09).
      - Exclusive-multiselect applied across the whole Systems Review (C07).
    acceptance: Sections show empty / partial / complete state correctly in the rail.

  - id: S4
    name: Section 10 — Posture & Muscle Tone
    est: 1 day
    contains:
      - MAS reference table (collapsible, collapsed by default).
      - Catalogue picker + dynamic grid, columns [Left MAS, Right MAS, Notes] (C01).
      - General tone assessment with prefill + contradiction warning from S5 (C08).
    acceptance: Selecting 4 muscle groups loads exactly 4 rows; de-select with data warns.

  - id: S5
    name: Section 11 — Range of Motion
    est: 1 day
    contains:
      - Motion catalogue split into discrete motions, grouped by region (C03).
      - Grid columns L PROM / L AROM / R PROM / R AROM / Pain / Notes.
      - Degrees-vs-graded config switch (C02), normal-range helper text.
      - Not-Tested cells with reason (C04); age-appropriate pain scale (C10).
      - Presets: Upper Limb, Lower Limb, Spine, Full Body, CP Baseline (C15).
    acceptance: A 14-row grid stays usable and keyboard-navigable on a 10-inch tablet.

  - id: S6
    name: Section 12 — Muscle Strength
    est: 0.5 day
    contains:
      - MRC reference table (collapsible).
      - Muscle-group catalogue + grid [L Grade /5, R Grade /5, Notes].
      - Column 'Method' dropped per the annotation on the supplied image.
    acceptance: Identical interaction model to sections 10 and 11 — no new learning.

  - id: S7
    name: Drafts for sections 6-9, placeholders for 13+, validation & sign-off
    est: 1 day
    contains:
      - Draft sections badged "DRAFT - pending your input".
      - Placeholder cards for future sections with a one-line description each.
      - Action 'Complete Assessment' produces a validation summary with clickable error links (C12).
      - Sign-off block, status pill Draft -> Signed, read-only after signing (C17).
    acceptance: Attempting to complete with gaps lists every outstanding field.

  - id: S8
    name: Print, review pack & handover
    est: 0.5 day
    contains:
      - Print stylesheet suppressing empty items (C14).
      - README with how-to-demo script for the client meeting.
      - decisions.md capturing what the client approved and what changed.
    acceptance: A filled assessment prints to clean A4 with signature block.

  - id: S9
    name: POST-APPROVAL — production implementation
    status: NOT IN THIS ROUND
    note: >
      assessment.config.js becomes the form schema; sections map to reactive
      form groups; catalogues become reference tables; grids become FormArrays.

# -----------------------------------------------------------------------------
# 7. RISKS
# -----------------------------------------------------------------------------
risks:
  - risk: Client approves the ROM 0-4 scale and it is rebuilt in degrees six months later.
    mitigation: Q1 answered in writing before stage 5; both modes shipped in the prototype.
  - risk: Missing sections 1 and 6-9 turn out to be substantial, expanding scope.
    mitigation: Drafts are badged, and stage 7 is re-estimated once images arrive.
  - risk: Prototype gets mistaken for a working product in the demo.
    mitigation: Persistent "PROTOTYPE - demonstration data only" ribbon; synthetic patient data only.
  - risk: Standardised outcome measures (GMFM etc.) are assumed to be included.
    mitigation: Q3; each measure is scoped and priced separately.
